[package]
name = "fmt"
version = "0.1.0"
edition = "2024"

[lib]
name = "fmt"
path = "src/lib.rs"

[[bin]]
name = "flurryfmt"
path = "src/main.rs"

[dependencies]
ast = { path = "../ast" }
diagnostic = { path = "../diagnostic" }
lex = { path = "../lex" }
parse = { path = "../parse" }
rustc_span = { workspace = true }
symbol = { workspace = true }
