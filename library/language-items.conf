# Standalone-driver source bindings. Explicit driver/CLI choices take precedence.
version = 1
copy-protocol = builtin.resources.Copy
drop-protocol = builtin.resources.Drop
meta-list-type = meta.List
tuple-type = builtin.tuple.Tuple
add-protocol = builtin.ops.Add
sub-protocol = builtin.ops.Sub
mul-protocol = builtin.ops.Mul
div-protocol = builtin.ops.Div
rem-protocol = builtin.ops.Rem
neg-protocol = builtin.ops.Neg
not-protocol = builtin.ops.Not
index-protocol = builtin.ops.Index
iterator-protocol = builtin.iterator.Iterator
ord-protocol = builtin.comparison.Ord
eq-protocol = builtin.comparison.Eq

# LLVM host scalar operations are bound by declaration identity, not spelling.
host-intrinsic.fma = builtin.math_intrinsics.target.Scalar.fma
host-intrinsic.sqrt = builtin.math_intrinsics.target.Scalar.sqrt
host-intrinsic.copysign = builtin.math_intrinsics.target.Scalar.copysign
