# Standalone-driver source bindings. Explicit driver/CLI choices take precedence.
version = 1
copy-protocol = builtin.protocols.resources.Copy
drop-protocol = builtin.protocols.resources.Drop
meta-list-type = meta.List
tuple-type = builtin.types.tuple.Tuple
add-protocol = builtin.protocols.ops.Add
sub-protocol = builtin.protocols.ops.Sub
mul-protocol = builtin.protocols.ops.Mul
div-protocol = builtin.protocols.ops.Div
rem-protocol = builtin.protocols.ops.Rem
neg-protocol = builtin.protocols.ops.Neg
not-protocol = builtin.protocols.ops.Not
index-protocol = builtin.protocols.ops.Index
iterator-protocol = builtin.protocols.iterator.Iterator
list-pattern-protocol = builtin.protocols.patterns.ListPatternView
ord-protocol = builtin.numeric.comparison.Ord
eq-protocol = builtin.numeric.comparison.Eq

# LLVM host scalar operations are bound by declaration identity, not spelling.
host-intrinsic.fma = builtin.numeric.math_intrinsics.target.Scalar.fma
